<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decks</title>
  </head>
  <body>
    <main id="app">
      <div id="stage"></div>
      <svg id="leaders" aria-hidden="true"><polyline class="info-connector" /></svg>
      <div id="labels" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <aside id="info" aria-live="polite" hidden></aside>

      <header class="deck-title">
        <p class="deck-name"></p>
        <p class="deck-sub"></p>
      </header>

      <section id="caption" aria-live="polite">
        <p class="step"></p>
        <h1 class="title"></h1>
        <p class="body"></p>
      </section>

      <nav id="nav" aria-label="Scenes">
        <p class="hint">Use ← → or click to step through</p>
        <a class="all-decks" href="./">All decks</a>
        <button class="view-toggle" type="button"></button>
        <button class="reset" type="button" hidden>Reset view</button>
        <button class="prev" type="button" aria-label="Previous scene">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
        </button>
        <ol class="dots"></ol>
        <button class="next" type="button" aria-label="Next scene">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" /></svg>
        </button>
      </nav>
    </main>
    <section id="picker" hidden></section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
